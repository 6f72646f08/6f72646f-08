<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080307" />
    <meta name="description" content="" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>_</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260807-9" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="terminal" id="terminal">
      <div class="terminal-bar" aria-hidden="true">
        <i></i><i></i><i></i>
        <time id="clock">--:--:--</time>
      </div>
      <div class="boot" id="boot" aria-live="polite">
        <div class="boot-core">
          <span id="boot-stage">INITIALIZING NODE</span>
          <strong id="boot-percent">000</strong>
          <div class="boot-track"><i id="boot-progress"></i></div>
          <div class="boot-codes" aria-hidden="true">
            <span>18.85</span><span>−19.74</span><span>01/∞</span>
          </div>
        </div>
      </div>
      <div class="watcher" id="watcher" aria-hidden="true" hidden>
        <div class="watcher-reveal" id="watcher-reveal"></div>
      </div>
      <div class="screen" id="screen" aria-live="polite">
        <div class="apparatus" aria-hidden="true">
          <div class="orbit"><span></span><span></span><span></span></div>
          <div class="pulse"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="telemetry">
            <b id="elapsed">000:00:00</b>
            <span id="metric-a">0.0031 / 77.04</span>
            <span id="coordinates">1885 / −1974</span>
          </div>
        </div>
        <div class="history" id="history"></div>
      </div>
      <form id="terminal-form" autocomplete="off">
        <label for="terminal-input" aria-label="Терминал">&gt;</label>
        <input id="terminal-input" type="text" autofocus spellcheck="false" aria-label="Командная строка" />
      </form>
    </main>
    <script src="script.js?v=20260807-9"></script>
  </body>
</html>
